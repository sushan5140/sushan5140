name: Refresh Halloween contribution calendar

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/render_halloween_contributions.py"
      - ".github/workflows/halloween-contributions.yml"

permissions:
  contents: write

concurrency:
  group: profile-halloween-contributions
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate calendar from actual GitHub contributions
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_GITHUB_USER: sushan5140
        run: python3 scripts/render_halloween_contributions.py

      - name: Commit updated SVG when activity changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/halloween-contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Halloween contribution calendar [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
            done
            echo "Unable to push generated calendar after 3 attempts" >&2
            exit 1
          fi
