<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Susan — R&D / Dev / 2AM</title>
<style>
:root{--bg:#080a0f;--panel:#0f1219;--line:#232936;--text:#eef1f6;--muted:#8c96a8;--rd:#77d5a6;--dev:#73a9ff;--am:#d28cff}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:radial-gradient(circle at 50% -20%,#171b29 0,#0b0d13 32%,#080a0f 70%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,a{font:inherit}.page{min-height:100vh;display:grid;place-items:center;padding:28px}.shell{width:min(1100px,100%);min-height:640px;border:1px solid #1d2330;border-radius:28px;background:rgba(11,14,21,.76);backdrop-filter:blur(16px);position:relative;overflow:hidden}
.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.dots{display:flex;gap:8px}.dot{width:10px;height:10px;border-radius:999px;background:#363d4b}.brand{font-size:13px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}.status{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#6f788a}
.hero{padding:84px 9% 40px;max-width:920px}.eyebrow{color:#7f899a;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-size:clamp(48px,9vw,96px);line-height:.9;letter-spacing:-.07em;margin:18px 0 22px}.hero p{font-size:clamp(17px,2.2vw,22px);line-height:1.55;color:#aeb6c5;max-width:720px}.hero strong{color:#fff}
.modes{padding:12px 9% 72px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mode{min-height:150px;text-align:left;border:1px solid var(--line);border-radius:20px;background:#0d1016;color:var(--text);padding:20px;cursor:pointer;transition:.22s ease;position:relative;overflow:hidden}.mode:hover{transform:translateY(-3px);border-color:#3c4558;background:#11151e}.mode small{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.mode h2{margin:20px 0 8px;font-size:28px;letter-spacing:-.04em}.mode p{margin:0;color:#7f899a;font-size:14px;line-height:1.45}.mode::after{content:"↗";position:absolute;right:18px;top:17px;color:#5c6678}.mode.rd h2{color:var(--rd)}.mode.dev h2{color:var(--dev)}.mode.am h2{color:var(--am)}
.overlay{position:absolute;inset:0;background:rgba(3,5,9,.72);display:none;align-items:center;justify-content:center;padding:5%;z-index:20}.overlay.open{display:flex}.window{width:min(900px,100%);max-height:82%;overflow:auto;border:1px solid #303746;border-radius:24px;background:#0e1118;box-shadow:0 30px 100px rgba(0,0,0,.55)}.winbar{position:sticky;top:0;background:rgba(14,17,24,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 18px;z-index:3}.winname{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#8e98a9}.close{width:34px;height:34px;border-radius:10px;border:1px solid #2b3240;background:#151922;color:#bbc3d1;cursor:pointer}.content{padding:28px}.content h3{font-size:clamp(34px,6vw,62px);letter-spacing:-.055em;margin:0 0 10px}.content>.lead{color:#9da7b7;font-size:17px;line-height:1.55;margin:0 0 28px;max-width:720px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:18px;border:1px solid var(--line);border-radius:16px;background:#11151d}.card h4{margin:0 0 8px;font-size:19px}.card p{color:#8d97a8;margin:0 0 14px;line-height:1.5;font-size:14px}.card a{color:#dce4f2;text-decoration:none;font-size:13px}.tag{display:inline-block;margin:0 6px 6px 0;border:1px solid #2b3342;padding:5px 8px;border-radius:999px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#8e98aa}.quote{border-left:2px solid #354055;padding:2px 0 2px 15px;color:#aeb7c6;margin:10px 0 24px}.foot{margin-top:28px;color:#657083;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.12em}
@media(max-width:720px){.page{padding:12px}.shell{border-radius:20px}.hero{padding:58px 24px 28px}.modes{grid-template-columns:1fr;padding:8px 24px 40px}.mode{min-height:110px}.grid{grid-template-columns:1fr}.overlay{padding:16px}.window{max-height:88%}.content{padding:22px}.topbar{padding:0 14px}.status{display:none}}
</style>
</head>
<body>
<main class="page">
<section class="shell" id="shell">
  <header class="topbar"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="brand">susan / portfolio.sys</div><div class="status">online · probably building</div></header>
  <section class="hero">
    <div class="eyebrow">AI systems · research engineering · product building</div>
    <h1>three modes.<br>same builder.</h1>
    <p>I build <strong>research systems</strong>, ship <strong>real products</strong>, and occasionally make things at 2:00 AM that probably should not exist — but somehow become useful.</p>
  </section>
  <section class="modes">
    <button class="mode rd" data-mode="rd"><small>01 / controlled experiments</small><h2>R&amp;D</h2><p>papers, hypotheses, benchmarks, uncertainty, falsification.</p></button>
    <button class="mode dev" data-mode="dev"><small>02 / shipped systems</small><h2>DEV</h2><p>products, full-stack builds, deployed tools, interfaces.</p></button>
    <button class="mode am" data-mode="am"><small>03 / questionable decisions</small><h2>2:00 AM</h2><p>weird little tools with suspiciously high usefulness.</p></button>
  </section>

  <div class="overlay" id="overlay" aria-hidden="true">
    <section class="window" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="winbar"><span class="winname" id="winname">MODE</span><button class="close" id="close" aria-label="Close">×</button></div>
      <div class="content" id="content"></div>
    </section>
  </div>
</section>
</main>
<script>
const data={
rd:{label:"R&D MODE / research.exe",title:"R&D",lead:"The professional side: research questions first, flashy metrics second. I care about what breaks, why it breaks, and whether the claim survives contact with a proper test.",quote:"Research first. Metrics second. Failure cases always.",items:[
["Minos-J","Falsification-driven reasoning for LLM research — rival hypotheses, executable tests, explicit failure conditions.","https://github.com/sushan5140/Minos-J","Falsification · Evaluation · Trustworthy AI"],
["Laya","Controlled experiments around premature closure and decision behavior.","https://github.com/sushan5140/Laya-sol","Reasoning · Experimental Design"],
["EvidenceGuard","Evidence-aware AI systems where fluent output is not treated as proof.","https://github.com/sushan5140/EvidenceGuard","Evidence · Retrieval · Reliability"],
["Real-World Ctrl-F","Vision + spatial memory for finding previously seen objects in the physical world.","https://github.com/sushan5140/real-world-ctrl-f","Computer Vision · Spatial Memory"]
]},
dev:{label:"DEV MODE / ship.exe",title:"DEV",lead:"The shipping side: auth, interfaces, databases, deployment, product logic, and the annoying last 20% that turns a prototype into something another human can actually use.",quote:"Ideas are cool. Shipping them is cooler.",items:[
["KMate","A full-stack GKS discovery and preparation platform with structured applicant and university workflows.","https://github.com/sushan5140/kmate","Next.js · TypeScript · Supabase"],
["Hallium","A Korean-learning companion built around guided practice and a more human-feeling learning flow.","https://github.com/sushan5140/hallium","Language Tech · Product"],
["Manhua Lens","A multilingual browser reading assistant for Korean, Japanese, Chinese and more.","https://github.com/sushan5140/manhua-lens","Manifest V3 · NLP"],
["Real-World Ctrl-F","One of the places where research turns into an actual interactive system.","https://github.com/sushan5140/real-world-ctrl-f","Vision · Product Engineering"]
]},
am:{label:"2:00 AM MODE / bad-idea.exe",title:"2:00 AM",lead:"Tiny experiments and weird internet tools born from the sentence: “this is so stupid” — followed ten minutes later by “wait, I would actually use this.”",quote:"good judgment has left the repository.",items:[
["Chatopsy","Perform an autopsy on a conversation. Dramatic? yes. Weirdly useful? also yes.","https://github.com/sushan5140/Chatopsy","Conversation Forensics-ish · Web"],
["next victim","Reserved for the next cursed little build. One sharp idea, no generic AI wrapper.","#","weekend build · TBD"],
["rule #1","Funny surface. Serious engineering underneath.","#","personality > wrapper"],
["rule #2","If the pitch sounds like “chat with your PDF but purple,” it dies here.","#","no slop"]
]}}
const overlay=document.getElementById("overlay"),content=document.getElementById("content"),winname=document.getElementById("winname"),close=document.getElementById("close");
function openMode(key){const d=data[key];winname.textContent=d.label;content.innerHTML='<h3 id="modalTitle">'+d.title+'</h3><p class="lead">'+d.lead+'</p><div class="quote">'+d.quote+'</div><div class="grid">'+d.items.map(i=>'<article class="card"><h4>'+i[0]+'</h4><p>'+i[1]+'</p><span class="tag">'+i[3]+'</span><br><a href="'+i[2]+'"'+(i[2]==="#"?'':' target="_blank" rel="noreferrer"')+'>'+(i[2]==="#"?'coming soon':'open repo ↗')+'</a></article>').join('')+'</div><div class="foot">esc to close · click another mode to switch</div>';overlay.classList.add("open");overlay.setAttribute("aria-hidden","false");close.focus()}
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>openMode(b.dataset.mode)));
function shut(){overlay.classList.remove("open");overlay.setAttribute("aria-hidden","true")}
close.addEventListener("click",shut);overlay.addEventListener("click",e=>{if(e.target===overlay)shut()});document.addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
</script>
</body>
</html>
